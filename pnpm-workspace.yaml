packages:
  - 'apps/*'
  - 'libs/*'
  - 'tests/*'

# pnpm 10 runs no dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild

# Skipped on purpose: prebuilt binaries already ship with them, or the script is just telemetry.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@parcel/watcher'
  - '@scarf/scarf'
  - cpu-features
  - protobufjs
