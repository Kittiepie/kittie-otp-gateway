# Infrastructure only (Postgres, Redis, RabbitMQ, Mailpit) for local development.
# The apps run on your machine with hot reload: pnpm infra:up, then pnpm --filter api start:dev.
# Values come from the root .env (--env-file); the :- defaults apply when it is missing.
name: otp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-otp_gateway}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-otp} -d $${POSTGRES_DB:-otp_gateway}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    # RabbitMQ names its data dir after the hostname; a fixed one keeps the volume reusable.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-otp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-otp_dev_password}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitdata:
